[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "private-ai-brain"
version = "0.2.1"
description = "Scratch-initialized causal Transformer training research platform for Original Brain"
requires-python = ">=3.11"
dependencies = ["torch>=2.4,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["brain*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
